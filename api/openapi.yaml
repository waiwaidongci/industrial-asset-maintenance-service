openapi: 3.0.3
info:
  title: Industrial Asset Maintenance Service
  version: 1.0.0
servers:
  - url: http://localhost:8085
paths:
  /healthz: {get: {responses: {200: {description: healthy}}}}
  /readyz: {get: {responses: {200: {description: ready}}}}
  /metrics: {get: {responses: {200: {description: prometheus metrics}}}}
  /summary: {get: {responses: {200: {description: maintenance summary}}}}
  /assets: {get: {responses: {200: {description: asset list}}}, post: {responses: {201: {description: asset created}}}}
  /templates: {get: {responses: {200: {description: template list}}}, post: {responses: {201: {description: template created}}}}
  /plans: {get: {responses: {200: {description: plan list}}}, post: {responses: {201: {description: plan created}}}}
  /plans/{id}/tasks: {post: {responses: {201: {description: task created}}}}
  /tasks/{id}/status: {post: {responses: {200: {description: task transitioned}}}}
  /findings: {get: {responses: {200: {description: findings}}}, post: {responses: {201: {description: finding reported}}}}
